<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berat AM AI - Modern Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: #f8fafc;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animasyonlu Arka Plan */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(147, 51, 234, 0.2));
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        .chat-container {
            height: calc(100vh - 180px);
            scrollbar-gutter: stable;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-bubble {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 1.5rem 1.5rem 0.25rem 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .ai-bubble {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 1.5rem 1.5rem 1.5rem 0.25rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .input-glass {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-glass:focus-within {
            border-color: #3b82f6;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: #60a5fa;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        .markdown-content p { margin-bottom: 0.75rem; }
        .markdown-content strong { color: #93c5fd; font-weight: 600; }
        .markdown-content code { background: rgba(0,0,0,0.3); padding: 0.1rem 0.3rem; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="blob"></div>

    <!-- Header -->
    <header class="p-5 flex justify-between items-center glass-panel border-b border-white/10 sticky top-0 z-20 mx-4 mt-4 rounded-2xl">
        <div class="flex items-center gap-4">
            <div class="relative">
                <div class="w-12 h-12 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-2xl">
                    <i class="fas fa-brain text-white text-xl"></i>
                </div>
                <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-4 border-slate-900 rounded-full"></span>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-tight leading-none mb-1">Berat <span class="text-blue-500">AM AI</span></h1>
                <p class="text-[11px] text-slate-400 font-medium uppercase tracking-widest">Gelişmiş Zeka Sistemi</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="clearChat()" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-red-500/10 text-slate-400 hover:text-red-400 transition-all" title="Temizle">
                <i class="fas fa-trash-alt"></i>
            </button>
            <div class="h-8 w-[1px] bg-white/10"></div>
            <button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white/5 text-slate-400 transition-all">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="max-w-4xl mx-auto p-4 md:p-8 chat-container overflow-y-auto space-y-8" id="chatArea">
        <div class="flex flex-col items-start max-w-[85%] animate-fade-in">
            <div class="ai-bubble p-5 shadow-xl text-slate-200 leading-relaxed">
                <p class="mb-2 font-semibold text-blue-400">Hoş geldin!</p>
                Ben **Berat AM AI**. Seninle sohbet etmek, sorularını yanıtlamak ve projelerinde sana yardımcı olmak için buradayım. Bugün senin için ne yapabilirim?
            </div>
            <span class="text-[10px] text-slate-500 mt-2 ml-3 font-medium uppercase tracking-tighter">Sistem Mesajı</span>
        </div>
    </main>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="max-w-4xl mx-auto px-8 mb-6 hidden">
        <div class="ai-bubble p-4 inline-flex gap-1.5 typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Input Area -->
    <div class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-[#020617] via-[#020617]/80 to-transparent">
        <div class="max-w-4xl mx-auto">
            <form id="chatForm" class="flex items-center gap-3">
                <div class="relative flex-1 group">
                    <input 
                        type="text" 
                        id="userInput"
                        placeholder="Bir şeyler sor veya komut ver..." 
                        class="w-full input-glass text-white rounded-2xl py-4 px-6 focus:outline-none transition-all placeholder:text-slate-500"
                        autocomplete="off"
                    >
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-3">
                        <button type="button" class="text-slate-500 hover:text-blue-400 transition-colors">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                </div>
                <button 
                    type="submit"
                    id="sendBtn"
                    class="bg-blue-600 hover:bg-blue-500 text-white w-14 h-14 rounded-2xl flex items-center justify-center transition-all active:scale-90 shadow-xl shadow-blue-600/20 disabled:opacity-50 disabled:grayscale"
                >
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            <div class="flex justify-center gap-4 mt-3">
                <span class="text-[10px] text-slate-500 flex items-center gap-1">
                    <i class="fas fa-bolt text-yellow-500"></i> Gemini 2.5 Flash Aktif
                </span>
                <span class="text-[10px] text-slate-500 flex items-center gap-1">
                    <i class="fas fa-shield-alt text-blue-500"></i> Güvenli Bağlantı
                </span>
            </div>
        </div>
    </div>

    <script>
        // API KEY boş bırakılmıştır. Bu ortamda API anahtarı sistem tarafından otomatik sağlanır.
        // Eğer dışarıda kullanacaksanız buraya kendi Google AI Studio anahtarınızı girmelisiniz.
        const apiKey = ""; 
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatArea = document.getElementById('chatArea');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, isUser = false) {
            const date = new Date();
            const time = date.getHours() + ":" + String(date.getMinutes()).padStart(2, '0');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} max-w-[88%] ${isUser ? 'ml-auto' : 'mr-auto'} animate-in fade-in slide-in-from-bottom-2 duration-300`;
            
            // Markdown ve biçimlendirme
            const formattedText = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`(.*?)`/g, '<code>$1</code>')
                .replace(/\n/g, '<br>');

            messageDiv.innerHTML = `
                <div class="${isUser ? 'user-bubble' : 'ai-bubble'} p-4 md:p-5 shadow-lg text-slate-100 markdown-content leading-relaxed">
                    ${formattedText}
                </div>
                <div class="flex items-center gap-2 mt-2 px-2">
                    ${isUser ? `<span class="text-[10px] text-blue-400 font-bold uppercase tracking-wider">Sen</span>` : `<span class="text-[10px] text-purple-400 font-bold uppercase tracking-wider">Berat AI</span>`}
                    <span class="text-[10px] text-slate-500 font-medium">${time}</span>
                </div>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
        }

        async function fetchAIResponse(userPrompt) {
            // Sadece bu önizleme ortamında çalışan endpoint
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: {
                    parts: [{ text: "Sen 'Berat AM AI' adında, son derece profesyonel, zeki, yaratıcı ve samimi bir yapay zeka asistanısın. Kullanıcıya her zaman en doğru, güncel ve detaylı bilgiyi ver. Yanıtlarını görsel olarak okunaklı olması için paragraflara ayır ve önemli noktaları kalın (bold) yap. Dil: Türkçe." }]
                }
            };

            // Retry logic with exponential backoff
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        console.error("API Error Detail:", errData);
                        throw new Error('API Hatası: ' + (errData.error?.message || 'Bilinmeyen hata'));
                    }

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Üzgünüm, şu an bir yanıt oluşturamıyorum.";
                } catch (error) {
                    console.warn(`Retry ${i + 1} due to:`, error);
                    if (i === 4) throw error;
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            
            if (message) {
                addMessage(message, true);
                userInput.value = '';
                userInput.disabled = true;
                sendBtn.disabled = true;
                
                typingIndicator.classList.remove('hidden');
                chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });

                try {
                    const aiResponse = await fetchAIResponse(message);
                    typingIndicator.classList.add('hidden');
                    addMessage(aiResponse, false);
                } catch (error) {
                    typingIndicator.classList.add('hidden');
                    console.error("Chat Error:", error);
                    addMessage(`**Hata:** Yanıt alınamadı. Lütfen internet bağlantınızı veya API anahtarınızı kontrol edin. Teknik detay: ${error.message}`, false);
                } finally {
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                }
            }
        });

        function clearChat() {
            chatArea.innerHTML = '';
            addMessage("Tüm hafıza temizlendi. Yepyeni bir konu hakkında konuşmaya hazır mısın? ✨", false);
        }

        window.onload = () => userInput.focus();
    </script>
</body>
</html>
