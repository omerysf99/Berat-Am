<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berat AM AI - Gerçek Yapay Zeka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .chat-container {
            height: calc(100vh - 160px);
        }

        .glass-morphism {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-bubble {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 20px 20px 4px 20px;
        }

        .ai-bubble {
            background: #334155;
            border-radius: 20px 20px 20px 4px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        .markdown-content p { margin-bottom: 0.5rem; }
        .markdown-content strong { color: #60a5fa; }
    </style>
</head>
<body class="overflow-hidden">

    <!-- Header -->
    <header class="p-6 flex justify-between items-center glass-morphism sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i class="fas fa-robot text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-tight">Berat <span class="text-blue-500 text-sm">AM AI</span></h1>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-xs text-slate-400">Canlı & Zeki</span>
                </div>
            </div>
        </div>
        <div class="flex gap-4">
            <button onclick="clearChat()" class="text-slate-400 hover:text-red-400 transition-colors" title="Sohbeti Temizle">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="max-w-4xl mx-auto p-4 md:p-6 chat-container overflow-y-auto space-y-6" id="chatArea">
        <div class="flex flex-col items-start max-w-[85%]">
            <div class="ai-bubble p-4 shadow-sm text-slate-100">
                Merhaba! Ben **Berat AM AI**. Gemini teknolojisiyle güçlendirildim. Her türlü sorunu cevaplayabilirim. Ne sormak istersin? 🚀
            </div>
            <span class="text-[10px] text-slate-500 mt-1 ml-2">Sistem</span>
        </div>
    </main>

    <!-- Typing Indicator -->
    <div id="typingIndicator" class="max-w-4xl mx-auto px-6 mb-4 hidden">
        <div class="ai-bubble p-3 inline-flex gap-1 typing-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Input Area -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-slate-900/50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto relative">
            <form id="chatForm" class="flex items-center gap-2">
                <div class="relative flex-1">
                    <input 
                        type="text" 
                        id="userInput"
                        placeholder="Berat AM AI'ya bir şey sor..." 
                        class="w-full bg-slate-800 border border-slate-700 text-white rounded-2xl py-4 px-6 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
                        autocomplete="off"
                    >
                </div>
                <button 
                    type="submit"
                    id="sendBtn"
                    class="bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-2xl flex items-center justify-center transition-all active:scale-95 shadow-lg shadow-blue-600/30 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
            <p class="text-center text-[10px] text-slate-500 mt-2">
                Powered by Gemini 2.5 Flash • Berat AM AI her soruya yanıt verir.
            </p>
        </div>
    </div>

    <script>
        const apiKey = ""; // Çevresel değişken tarafından otomatik doldurulur
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatArea = document.getElementById('chatArea');
        const typingIndicator = document.getElementById('typingIndicator');
        const sendBtn = document.getElementById('sendBtn');

        // Mesaj Geçmişi (Bağlam için)
        let chatHistory = [];

        function addMessage(text, isUser = false) {
            const date = new Date();
            const time = date.getHours() + ":" + String(date.getMinutes()).padStart(2, '0');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} max-w-[85%] ${isUser ? 'ml-auto' : 'mr-auto'}`;
            
            // Basit markdown kalınlaştırma desteği
            const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');

            messageDiv.innerHTML = `
                <div class="${isUser ? 'user-bubble' : 'ai-bubble'} p-4 shadow-md text-white markdown-content">
                    ${formattedText}
                </div>
                <span class="text-[10px] text-slate-500 mt-1 ${isUser ? 'mr-2' : 'ml-2'}">${time}</span>
            `;
            
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function fetchAIResponse(userPrompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ 
                    parts: [{ text: userPrompt }] 
                }],
                systemInstruction: {
                    parts: [{ text: "Sen 'Berat AM AI' adında, yardımsever, zeki ve samimi bir yapay zeka asistanısın. Kullanıcının her türlü sorusuna detaylı ve doğru cevaplar vermelisin. Cevaplarını Türkçe dilinde ver." }]
                }
            };

            // Exponential Backoff Retry Logic
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error('API Hatası');

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Üzgünüm, şu an cevap üretemiyorum.";
                } catch (error) {
                    if (i === 4) throw error;
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                }
            }
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            
            if (message) {
                // UI Güncelle
                addMessage(message, true);
                userInput.value = '';
                userInput.disabled = true;
                sendBtn.disabled = true;
                
                typingIndicator.classList.remove('hidden');
                chatArea.scrollTop = chatArea.scrollHeight;

                try {
                    const aiResponse = await fetchAIResponse(message);
                    typingIndicator.classList.add('hidden');
                    addMessage(aiResponse, false);
                } catch (error) {
                    typingIndicator.classList.add('hidden');
                    addMessage("Bir bağlantı hatası oluştu. Lütfen tekrar dene.", false);
                } finally {
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.focus();
                }
            }
        });

        function clearChat() {
            chatArea.innerHTML = '';
            addMessage("Sohbet geçmişi temizlendi. Yeni bir soru sormaya ne dersin? 😊", false);
        }

        window.onload = () => userInput.focus();
    </script>
</body>
</html>
